<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Two Years, Twenty-Six Chapters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">

<!--
  HOW TO EDIT THIS PAGE (for the person setting this up):

  1. TEXT: Scroll down to the big "entries" list inside the <script> tag near the
     bottom of this file. Each entry has a "text" field — edit the words between
     the quotes to change any poem or letter. Use \n\n for a new paragraph break.

  2. PHOTOS: Make a folder called "photos" in the same place as this HTML file.
     Each entry below has a "photo" field like "photos/2024-08.jpeg" — just save
     your picture with that exact file name (or change the field to match your
     file name) and it will appear automatically. If no photo is found, a cute
     placeholder shows instead, so nothing breaks if you skip a month.

  3. Everything else (colors, layout, animation) can be left alone — it will
     just work once you open the file in a browser.
-->

<style>
  :root{
    --cream:#FFF8F1;
    --ink:#4A3B52;
    --ink-soft:#7A6B85;
    --pink:#F0A8C4;
    --pink-deep:#E387AC;
    --lavender:#B7A6E6;
    --mint:#9FD6D3;
    --peach:#F4BE8E;
    --gold:#E7B04E;
    --white:#FFFFFF;
    --shadow: 0 12px 30px rgba(74,59,82,0.12);
  }

  *{ box-sizing:border-box; }

  html{ scroll-behavior:smooth; }

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 15% 10%, rgba(240,168,196,0.18), transparent 40%),
      radial-gradient(circle at 85% 85%, rgba(183,166,230,0.18), transparent 40%),
      var(--cream);
    color:var(--ink);
    font-family:'Fredoka', sans-serif;
    overflow-x:hidden;
  }

  button{ font-family:inherit; cursor:pointer; border:none; }

  /* ---------- decorative bunny mark ---------- */
  .bunny-mark{ display:inline-block; }

  /* ---------- SCREEN 1 : the question ---------- */
  #screen-question{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:2rem;
    position:relative;
  }

  .q-eyebrow{
    font-size:0.95rem;
    color:var(--ink-soft);
    letter-spacing:0.02em;
    margin-bottom:0.6rem;
  }

  .q-headline{
    font-size:clamp(1.9rem, 5vw, 3.4rem);
    font-weight:600;
    line-height:1.25;
    max-width:16ch;
    margin:0 0 2.4rem 0;
  }

  .q-buttons{
    display:flex;
    gap:1.4rem;
    align-items:center;
    flex-wrap:wrap;
    justify-content:center;
  }

  #yesBtn{
    background:var(--pink-deep);
    color:var(--white);
    font-size:1.15rem;
    font-weight:600;
    padding:0.95rem 2.6rem;
    border-radius:999px;
    box-shadow:var(--shadow);
    transition:transform 0.15s ease, box-shadow 0.15s ease;
  }
  #yesBtn:hover{ transform:translateY(-2px) scale(1.03); box-shadow:0 16px 34px rgba(227,135,172,0.35); }
  #yesBtn:active{ transform:translateY(0) scale(0.98); }

  #noBtn{
    background:transparent;
    color:var(--ink-soft);
    font-size:1.05rem;
    font-weight:500;
    padding:0.9rem 2.2rem;
    border-radius:999px;
    border:2px solid rgba(122,107,133,0.35);
    position:fixed;
    transition:left 0.28s cubic-bezier(.2,.9,.3,1.3), top 0.28s cubic-bezier(.2,.9,.3,1.3);
    z-index:5;
  }

  .q-hint{
    margin-top:2.4rem;
    font-size:0.85rem;
    color:var(--ink-soft);
    opacity:0.7;
  }

  /* ---------- SCREEN 2 : calendar ---------- */
  #screen-calendar{
    display:none;
    max-width:920px;
    margin:0 auto;
    padding:3.5rem 1.5rem 6rem;
  }

  .cal-header{
    text-align:center;
    margin-bottom:3rem;
  }

  .cal-header h1{
    font-size:clamp(1.8rem, 4.4vw, 2.7rem);
    font-weight:600;
    margin:0 0 0.7rem 0;
    line-height:1.25;
  }

  .cal-header p{
    color:var(--ink-soft);
    font-size:1.02rem;
    max-width:46ch;
    margin:0 auto;
    line-height:1.6;
  }

  .year-block{ margin-bottom:2.6rem; }

  .year-label{
    display:flex;
    align-items:center;
    gap:0.9rem;
    font-size:1.05rem;
    font-weight:600;
    color:var(--ink-soft);
    margin-bottom:1rem;
  }
  .year-label::after{
    content:"";
    flex:1;
    height:1px;
    background:rgba(122,107,133,0.2);
  }

  .month-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(96px, 1fr));
    gap:0.85rem;
  }

  .month-btn{
    background:var(--white);
    border-radius:18px;
    padding:1rem 0.6rem 0.85rem;
    text-align:center;
    box-shadow:0 4px 14px rgba(74,59,82,0.08);
    border:2px solid transparent;
    transition:transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    position:relative;
  }
  .month-btn:hover{ transform:translateY(-3px); box-shadow:0 10px 22px rgba(74,59,82,0.14); }
  .month-btn:focus-visible{ outline:3px solid var(--pink-deep); outline-offset:2px; }

  .month-btn .m-name{ display:block; font-weight:600; font-size:1rem; }
  .month-btn .m-dot{
    display:block;
    width:9px; height:9px;
    border-radius:50%;
    margin:0.5rem auto 0;
  }

  .month-btn.season-winter .m-dot{ background:var(--lavender); }
  .month-btn.season-spring .m-dot{ background:var(--pink); }
  .month-btn.season-summer .m-dot{ background:var(--mint); }
  .month-btn.season-autumn .m-dot{ background:var(--peach); }

  .month-btn.is-special{ border-color:var(--gold); }
  .month-btn.is-special .m-name::after{
    content:" ✦";
    color:var(--gold);
  }

  /* ---------- MODAL ---------- */
  #overlay{
    display:none;
    position:fixed; inset:0;
    background:rgba(74,59,82,0.45);
    backdrop-filter:blur(2px);
    z-index:50;
    align-items:center;
    justify-content:center;
    padding:1.5rem;
  }

  .modal{
    background:var(--cream);
    border-radius:22px;
    max-width:560px;
    width:100%;
    max-height:88vh;
    overflow-y:auto;
    padding:2.1rem 1.9rem 2.3rem;
    box-shadow:0 24px 60px rgba(74,59,82,0.3);
    position:relative;
  }

  .modal-close{
    position:absolute;
    top:1rem; right:1rem;
    background:rgba(122,107,133,0.1);
    width:34px; height:34px;
    border-radius:50%;
    font-size:1.1rem;
    color:var(--ink-soft);
    display:flex; align-items:center; justify-content:center;
  }
  .modal-close:hover{ background:rgba(122,107,133,0.2); }

  .modal-date{
    font-size:0.85rem;
    font-weight:600;
    color:var(--pink-deep);
    letter-spacing:0.02em;
    margin-bottom:0.3rem;
  }
  .modal-date.special{ color:var(--gold); }

  .modal-title{
    font-size:1.5rem;
    font-weight:600;
    margin:0 0 1.2rem 0;
  }

  .photo-frame{
    width:100%;
    aspect-ratio:4/3;
    border-radius:16px;
    overflow:hidden;
    margin-bottom:1.4rem;
    background:linear-gradient(135deg, rgba(240,168,196,0.25), rgba(183,166,230,0.25));
    display:flex; align-items:center; justify-content:center;
  }
  .photo-frame img{ width:100%; height:100%; object-fit:cover; display:block; }
  .photo-placeholder{
    text-align:center;
    color:var(--ink-soft);
    font-size:0.85rem;
    padding:1rem;
    line-height:1.5;
  }
  .photo-placeholder svg{ width:34px; height:34px; margin-bottom:0.4rem; }

  .modal-text{
    font-family:'Caveat', cursive;
    font-size:1.5rem;
    line-height:1.55;
    white-space:pre-wrap;
    color:var(--ink);
  }

  /* ---------- confetti (birthday only) ---------- */
  .confetti{
    position:fixed;
    top:-10px;
    width:8px; height:14px;
    border-radius:2px;
    z-index:60;
    pointer-events:none;
    animation:fall linear forwards;
  }
  @keyframes fall{
    to{ transform:translateY(105vh) rotate(320deg); opacity:0.9; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; }
  }

  @media (max-width:480px){
    #noBtn{ font-size:0.95rem; padding:0.75rem 1.6rem; }
    .modal{ padding:1.6rem 1.3rem 1.9rem; }
  }
</style>
</head>
<body>

<!-- ================= SCREEN 1 ================= -->
<section id="screen-question">
  <div class="q-eyebrow">a little something before your 18th</div>
  <h1 class="q-headline">Do you want to relive your past two years?</h1>
  <div class="q-buttons">
    <button id="yesBtn">yes, show me</button>
    <button id="noBtn">no thanks</button>
  </div>
  <p class="q-hint">(you only really have one option here)</p>
</section>

<!-- ================= SCREEN 2 ================= -->
<section id="screen-calendar">
  <div class="cal-header">
    <h1>Two Years, Twenty-Six Chapters</h1>
    <p>Every month since August 2024, right up to your 18th birthday. Tap a month to open it.</p>
  </div>
  <div id="yearContainer"></div>
</section>

<!-- ================= MODAL ================= -->
<div id="overlay">
  <div class="modal" role="dialog" aria-modal="true">
    <button class="modal-close" id="closeModal" aria-label="Close">✕</button>
    <div class="modal-date" id="modalDate"></div>
    <h2 class="modal-title" id="modalTitle"></h2>
    <div class="photo-frame" id="photoFrame"></div>
    <div class="modal-text" id="modalText"></div>
  </div>
</div>

/* ---------- build screen 2 ---------- */
const yearContainer = document.getElementById('yearContainer');
const years = [...new Set(entries.map(e => e.year))];

years.forEach(year => {
  const block = document.createElement('div');
  block.className = 'year-block';

  const label = document.createElement('div');
  label.className = 'year-label';
  label.textContent = year;
  block.appendChild(label);

  const grid = document.createElement('div');
  grid.className = 'month-grid';

  entries.filter(e => e.year === year).forEach(entry => {
    const btn = document.createElement('button');
    btn.className = `month-btn season-${entry.season}` + (entry.special ? ' is-special' : '');
    btn.innerHTML = `<span class="m-name">${entry.month}</span><span class="m-dot"></span>`;
    btn.addEventListener('click', () => openEntry(entry));
    grid.appendChild(btn);
  });

  block.appendChild(grid);
  yearContainer.appendChild(block);
});

/* ---------- modal logic ---------- */
const overlay = document.getElementById('overlay');
const modalDate = document.getElementById('modalDate');
const modalTitle = document.getElementById('modalTitle');
const modalText = document.getElementById('modalText');
const photoFrame = document.getElementById('photoFrame');

function openEntry(entry){
  modalDate.textContent = `${entry.month} ${entry.year}`;
  modalDate.className = 'modal-date' + (entry.special ? ' special' : '');
  modalTitle.textContent = entry.title || `${entry.month} ${entry.year}`;
  modalText.textContent = entry.text;

  photoFrame.innerHTML = '';
  const img = document.createElement('img');
  img.src = entry.photo;
  img.alt = `Photo from ${entry.month} ${entry.year}`;
  img.onerror = function(){
    photoFrame.innerHTML = `<div class="photo-placeholder">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
        <path d="M4 16l4.5-5.5a2 2 0 0 1 3 0L16 16"/>
        <circle cx="9" cy="9" r="1.6"/>
        <rect x="3" y="4" width="18" height="16" rx="3"/>
      </svg>
      add a photo here — save it as<br><strong>${entry.photo}</strong>
    </div>`;
  };
  photoFrame.appendChild(img);

  overlay.style.display = 'flex';
  if(entry.birthday){ launchConfetti(); }
}

document.getElementById('closeModal').addEventListener('click', () => overlay.style.display = 'none');
overlay.addEventListener('click', e => { if(e.target === overlay) overlay.style.display = 'none'; });
document.addEventListener('keydown', e => { if(e.key === 'Escape') overlay.style.display = 'none'; });

/* ---------- confetti, birthday only ---------- */
function launchConfetti(){
  const colors = ['#F0A8C4','#B7A6E6','#9FD6D3','#F4BE8E','#E7B04E'];
  for(let i=0;i<60;i++){
    const piece = document.createElement('div');
    piece.className = 'confetti';
    piece.style.left = Math.random()*100 + 'vw';
    piece.style.background = colors[Math.floor(Math.random()*colors.length)];
    piece.style.animationDuration = (2.2 + Math.random()*1.6) + 's';
    piece.style.opacity = 0.85;
    document.body.appendChild(piece);
    setTimeout(() => piece.remove(), 4200);
  }
}

/* ---------- screen 1: unclickable "no" button ---------- */
const noBtn = document.getElementById('noBtn');
const yesBtn = document.getElementById('yesBtn');

function moveNoButton(){
  const margin = 24;
  const w = noBtn.offsetWidth || 140;
  const h = noBtn.offsetHeight || 50;
  const maxX = Math.max(margin, window.innerWidth - w - margin);
  const maxY = Math.max(margin, window.innerHeight - h - margin);
  const x = margin + Math.random() * (maxX - margin);
  const y = margin + Math.random() * (maxY - margin);
  noBtn.style.left = x + 'px';
  noBtn.style.top = y + 'px';
}

function placeNoButtonInitially(){
  const yesRect = yesBtn.getBoundingClientRect();
  noBtn.style.left = (yesRect.right + 24) + 'px';
  noBtn.style.top = yesRect.top + 'px';
}

window.addEventListener('load', placeNoButtonInitially);
noBtn.addEventListener('mouseenter', moveNoButton);
noBtn.addEventListener('pointerdown', e => { e.preventDefault(); moveNoButton(); });
noBtn.addEventListener('touchstart', e => { e.preventDefault(); moveNoButton(); }, {passive:false});
noBtn.addEventListener('click', e => { e.preventDefault(); moveNoButton(); });

yesBtn.addEventListener('click', () => {
  document.getElementById('screen-question').style.display = 'none';
  document.getElementById('screen-calendar').style.display = 'block';
  window.scrollTo(0,0);
});
</script>
</body>
</html>
